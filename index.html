```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>College Guide Hub</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#eef2f7;
}

.header{
    background:linear-gradient(135deg,#1e3a8a,#2563eb);
    color:white;
    text-align:center;
    padding:25px;
}

.header h1{
    font-size:32px;
}

.header p{
    margin-top:8px;
}

.chat-container{
    width:90%;
    max-width:900px;
    margin:25px auto;
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(0,0,0,0.12);
}

.quick-buttons{
    padding:15px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    background:#f8fafc;
    border-bottom:1px solid #ddd;
}

.quick-buttons button{
    padding:10px 15px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#e5e7eb;
}

.quick-buttons button:hover{
    background:#d1d5db;
}

#chatbox{
    height:500px;
    overflow-y:auto;
    padding:20px;
    background:#f8fafc;
}

.user{
    background:#2563eb;
    color:white;
    padding:12px;
    border-radius:15px 15px 0 15px;
    max-width:75%;
    margin-left:auto;
    margin-bottom:15px;
}

.bot{
    background:white;
    padding:15px;
    border-radius:15px 15px 15px 0;
    border:1px solid #ddd;
    max-width:80%;
    margin-bottom:15px;
    line-height:1.6;
}

.input-area{
    display:flex;
    padding:15px;
    border-top:1px solid #ddd;
}

input{
    flex:1;
    padding:14px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

.send-btn{
    margin-left:10px;
    padding:14px 20px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    cursor:pointer;
}

.footer{
    text-align:center;
    padding:15px;
    color:#666;
}

h3{
    color:#2563eb;
    margin-bottom:10px;
}

ul{
    margin-left:20px;
}

</style>
</head>

<body>

<div class="header">
    <h1>🎓 College Guide Hub</h1>
    <p>AI-Based College Placement Assistance Chatbot</p>
</div>

<div class="chat-container">

    <div class="quick-buttons">
        <button onclick="fillQuestion('companies')">Companies</button>
        <button onclick="fillQuestion('resume tips')">Resume</button>
        <button onclick="fillQuestion('interview')">Interview</button>
        <button onclick="fillQuestion('career guidance')">Career</button>
        <button onclick="fillQuestion('internship')">Internships</button>
    </div>

    <div id="chatbox">
        <div class="bot">
            👋 Welcome to College Guide Hub.<br><br>
            Ask me about:
            <ul>
                <li>Placement Companies</li>
                <li>Resume Tips</li>
                <li>Interview Questions</li>
                <li>Career Guidance</li>
                <li>Internships</li>
            </ul>
        </div>
    </div>

    <div class="input-area">
        <input
            type="text"
            id="question"
            placeholder="Ask your question..."
            onkeypress="handleEnter(event)"
        >

        <button class="send-btn" onclick="sendMessage()">
            Send
        </button>
    </div>

</div>

<div class="footer">
    College Guide Hub © 2025
</div>

<script>

function fillQuestion(text){
    document.getElementById("question").value = text;
}

function handleEnter(event){
    if(event.key === "Enter"){
        sendMessage();
    }
}

function sendMessage(){

    let input = document.getElementById("question");
    let question = input.value.trim();

    if(question==="") return;

    let chat = document.getElementById("chatbox");

    chat.innerHTML +=
    `<div class="user">${question}</div>`;

    let q = question.toLowerCase();

    let answer = "";

    if(q.includes("companies") || q.includes("company")){

        answer = `
        <h3>Upcoming Placement Companies</h3>

        <ul>
        <li>TCS</li>
        <li>Infosys</li>
        <li>Wipro</li>
        <li>Accenture</li>
        <li>Cognizant</li>
        <li>Capgemini</li>
        <li>Deloitte</li>
        </ul>

        <b>Expected Drives:</b> August–September
        `;
    }

    else if(q.includes("tcs")){

        answer = `
        <h3>TCS Placement Details</h3>

        <ul>
        <li>Eligibility: 60%+</li>
        <li>Package: 3.5–7 LPA</li>
        <li>Aptitude Test</li>
        <li>Technical Interview</li>
        <li>HR Interview</li>
        </ul>
        `;
    }

    else if(q.includes("resume")){

        answer = `
        <h3>Resume Tips</h3>

        <ul>
        <li>Keep resume one page</li>
        <li>Add projects</li>
        <li>Add internships</li>
        <li>Add certifications</li>
        <li>Add GitHub profile</li>
        <li>Add LinkedIn profile</li>
        </ul>
        `;
    }

    else if(q.includes("interview")){

        answer = `
        <h3>Interview Preparation</h3>

        <b>HR Questions</b>

        <ul>
        <li>Tell me about yourself</li>
        <li>Why should we hire you?</li>
        <li>What are your strengths?</li>
        <li>What are your goals?</li>
        </ul>

        <b>Technical Topics</b>

        <ul>
        <li>DBMS</li>
        <li>OOP</li>
        <li>Data Structures</li>
        <li>Operating Systems</li>
        <li>Computer Networks</li>
        </ul>
        `;
    }

    else if(q.includes("career")){

        answer = `
        <h3>Career Guidance</h3>

        <ul>
        <li>Software Developer</li>
        <li>Data Analyst</li>
        <li>AI Engineer</li>
        <li>Cloud Engineer</li>
        <li>Cyber Security Specialist</li>
        </ul>

        <b>Recommended Certifications</b>

        <ul>
        <li>AWS Cloud Practitioner</li>
        <li>Google Data Analytics</li>
        <li>IBM AI Fundamentals</li>
        </ul>
        `;
    }

    else if(q.includes("internship")){

        answer = `
        <h3>Internship Opportunities</h3>

        <ul>
        <li>Google STEP</li>
        <li>Microsoft Internship</li>
        <li>Amazon Internship</li>
        <li>IBM Internship</li>
        <li>Deloitte Internship</li>
        </ul>
        `;
    }

    else if(q.includes("placement")){

        answer = `
        <h3>Placement Guidance</h3>

        <ul>
        <li>Register for drives</li>
        <li>Check eligibility</li>
        <li>Prepare aptitude</li>
        <li>Practice interviews</li>
        <li>Update resume</li>
        </ul>
        `;
    }

    else{

        answer = `
        <h3>Try Asking</h3>

        <ul>
        <li>Companies</li>
        <li>TCS Placement</li>
        <li>Resume Tips</li>
        <li>Interview Questions</li>
        <li>Career Guidance</li>
        <li>Internships</li>
        </ul>
        `;
    }

    chat.innerHTML +=
    `<div class="bot">${answer}</div>`;

    input.value = "";
    chat.scrollTop = chat.scrollHeight;
}

</script>

</body>
</html>
```
