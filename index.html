<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Guide Hub</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#eef2f7;
transition:0.3s;
}

.header{
background:linear-gradient(135deg,#1e3a8a,#2563eb);
color:white;
padding:25px;
text-align:center;
}

.header h1{
font-size:32px;
}

.header button{
margin-top:10px;
padding:8px 15px;
border:none;
border-radius:8px;
cursor:pointer;
}

.chat-container{
width:90%;
max-width:900px;
margin:25px auto;
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 8px 25px rgba(0,0,0,0.15);
}

.quick-buttons{
padding:15px;
display:flex;
gap:10px;
flex-wrap:wrap;
background:#f8fafc;
border-bottom:1px solid #ddd;
}

.quick-buttons button{
padding:10px 15px;
border:none;
border-radius:8px;
cursor:pointer;
}

#chatbox{
height:500px;
overflow-y:auto;
padding:20px;
background:#f8fafc;
}

.user{
background:#2563eb;
color:white;
padding:12px;
border-radius:15px 15px 0 15px;
max-width:75%;
margin-left:auto;
margin-bottom:15px;
}

.bot{
background:white;
padding:15px;
border-radius:15px 15px 15px 0;
border:1px solid #ddd;
max-width:80%;
margin-bottom:15px;
line-height:1.6;
}

.input-area{
display:flex;
padding:15px;
border-top:1px solid #ddd;
}

input{
flex:1;
padding:14px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
}

.send-btn{
margin-left:10px;
padding:14px 18px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
cursor:pointer;
}

.voice-btn{
margin-left:10px;
padding:14px 18px;
border:none;
border-radius:10px;
background:#10b981;
color:white;
cursor:pointer;
}

.footer{
text-align:center;
padding:15px;
color:#666;
}

.dark{
background:#111827;
color:white;
}

.dark .chat-container{
background:#1f2937;
}

.dark #chatbox{
background:#111827;
}

.dark .bot{
background:#374151;
color:white;
border:none;
}

.dark .quick-buttons{
background:#1f2937;
}

small{
opacity:0.7;
font-size:11px;
}

h3{
color:#2563eb;
margin-bottom:10px;
}

ul{
margin-left:20px;
}

</style>
</head>
<body>

<div class="header">
<h1>🎓 College Guide Hub</h1>
<p>AI-Based College Placement Assistance Chatbot</p>

<button onclick="toggleTheme()">
🌙 Dark Mode
</button>
</div>

<div class="chat-container">

<div class="quick-buttons">
<button onclick="fillQuestion('companies')">Companies</button>
<button onclick="fillQuestion('resume')">Resume</button>
<button onclick="fillQuestion('interview')">Interview</button>
<button onclick="fillQuestion('career')">Career</button>
<button onclick="fillQuestion('internship')">Internship</button>
</div>

<div id="chatbox">

<div class="bot">
👋 Welcome to College Guide Hub.

<br><br>

Ask me about:

<ul>
<li>Placement Companies</li>
<li>TCS Placement</li>
<li>Resume Tips</li>
<li>Interview Questions</li>
<li>Career Guidance</li>
<li>Internships</li>
</ul>

</div>

</div>

<div class="input-area">

<input
type="text"
id="question"
placeholder="Ask your question..."
onkeypress="handleEnter(event)"
>

<button class="send-btn"
onclick="sendMessage()">
Send
</button>

<button class="voice-btn"
onclick="startVoice()">
🎤
</button>

</div>

</div>

<div class="footer">
College Guide Hub © 2025
</div>

<script>

window.onload=function(){

let saved=
localStorage.getItem("chatHistory");

if(saved){
document.getElementById("chatbox").innerHTML=
saved;
}

}

function saveChat(){

localStorage.setItem(
"chatHistory",
document.getElementById("chatbox").innerHTML
);

}

function toggleTheme(){

document.body.classList.toggle("dark");

}

function fillQuestion(text){

document.getElementById("question").value=text;

}

function handleEnter(event){

if(event.key==="Enter"){
sendMessage();
}

}

function startVoice(){

if(!('webkitSpeechRecognition' in window)){
alert("Voice input not supported.");
return;
}

const recognition=
new webkitSpeechRecognition();

recognition.onresult=function(event){

document.getElementById("question").value=
event.results[0][0].transcript;

};

recognition.start();

}

function sendMessage(){

let input=
document.getElementById("question");

let question=
input.value.trim();

if(question==="") return;

let chat=
document.getElementById("chatbox");

let time=
new Date().toLocaleTimeString([],{
hour:'2-digit',
minute:'2-digit'
});

chat.innerHTML+=
`<div class="user">
${question}
<br>
<small>${time}</small>
</div>`;

question.toLowerCase();

chat.innerHTML+=

</script>

</html>
